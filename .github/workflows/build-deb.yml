name: Build packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint plugin syntax
        run: make lint

      - name: Build deb and ipk packages
        run: make packages

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: vidio-deb
          path: dist/*.deb

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v6
        with:
          name: vidio-ipk
          path: dist/*.ipk
